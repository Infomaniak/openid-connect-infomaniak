services:
  db:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: wordpress
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10

  wordpress:
    image: wordpress:php8.2-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', true);
    volumes:
      - wp_core:/var/www/html
      - .:/var/www/html/wp-content/plugins/infomaniak-connect-openid
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/wp-login.php"]
      interval: 10s
      timeout: 5s
      retries: 5

  wp-cli:
    image: wordpress:cli-php8.2
    depends_on:
      wordpress:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_core:/var/www/html
      - .:/var/www/html/wp-content/plugins/infomaniak-connect-openid
    command: >
      sh -c "
        wp core install --url='http://localhost:8080' --title='OIDC Test' --admin_user=admin --admin_password=admin --admin_email=admin@example.com --allow-root &&
        wp plugin activate infomaniak-connect-openid --allow-root &&
        echo 'WordPress ready at http://localhost:8080'
      "

volumes:
  db_data:
  wp_core:
